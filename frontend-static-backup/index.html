<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACC-Telemetry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css">
  
</head>
<body>
  <main class="app-shell">
    <section id="loginView" class="view auth-view">
      <div class="app-hero">
        <div class="hero-content">
          <h1>ACC-Telemetry</h1>
        </div>
      </div>

      <div class="app-salute">
        <div class="app-salute-text"> 
          <h1>Benvenuto, effettua l'accesso.</h1>
        </div>
      </div>

      <div class="auth-panel">
        <p class="eyebrow">Benvenuto</p>
        <h1>Login</h1>

        <form id="loginForm" class="form-stack">
          <label>
            User ID
            <input id="userIdInput" name="userId" autocomplete="username" placeholder="personal-user" required>
          </label>

          <label>
            Endpoint HTTP API Gateway
            <input id="apiUrlInput" name="apiUrl" type="url" placeholder="https://iu9g1sfq9j.execute-api.eu-south-1.amazonaws.com/" required>
          </label>

          <button type="submit" class="primary-action">Entra</button>
        </form>
      </div>
    </section>

    <section id="menuView" class="view menu-view hidden">
      <div class="menu-panel">
        <p class="eyebrow">Menu</p>
        <h1>ACC-Telemetry</h1>

        <div class="menu-actions">
          <button id="sessionListBtn" class="ghost-action" type="button">Lista Sessioni</button>
          <button id="liveSessionBtn" class="primary-action" type="button">Sessione Live</button>
        </div>
      </div>
    </section>

    <section id="sessionsView" class="view hidden">
      <div class="section-head">
        <div>
          <p class="eyebrow">Storico</p>
          <h1>Lista Sessioni</h1>
        </div>
        <button class="ghost-action small-action" data-go-menu type="button">Menu</button>
      </div>

      <div id="sessionList" class="session-list"></div>
    </section>

    <section id="dashboardView" class="view hidden">
      <div class="section-head">
        <div>
          <p id="dashboardMode" class="eyebrow">Live</p>
          <h1 id="dashboardTitle">Sessione Live</h1>
        </div>

        <div class="toolbar">
          <button id="pauseLiveBtn" class="ghost-action small-action" type="button">Ferma live</button>
          <button class="ghost-action small-action" data-go-menu type="button">Menu</button>
        </div>
      </div>

      <div class="metric-grid">
        <article class="metric-box">
          <span>Ultimo giro</span>
          <strong id="lastLapMetric">-</strong>
        </article>
        <article class="metric-box">
          <span>Best lap</span>
          <strong id="bestLapMetric">-</strong>
        </article>
        <article class="metric-box">
          <span>Fuel</span>
          <strong id="fuelMetric">-</strong>
        </article>
        <article class="metric-box">
          <span>Gomme</span>
          <strong id="tyreMetric">-</strong>
        </article>
      </div>

      <div class="chart-grid">
        <article class="chart-panel">
          <h2>Trend carburante</h2>
          <div class="chart-body">
            <canvas id="fuelChart"></canvas>
          </div>
        </article>
        <article class="chart-panel">
          <h2>Temperatura gomme</h2>
          <div class="chart-body">
            <canvas id="tyreChart"></canvas>
          </div>
        </article>
        <article class="chart-panel">
          <h2>Tempi giro</h2>
          <div class="chart-body">
            <canvas id="lapChart"></canvas>
          </div>
        </article>
        <article class="chart-panel">
          <h2>Temperatura freni</h2>
          <div class="chart-body">
            <canvas id="brakeChart"></canvas>
          </div>
        </article>
      </div>

      <section class="insight-panel">
        <div>
          <p class="eyebrow">Conclusioni</p>
          <p id="sessionInsight" class="insight-text">Nessun dato sessione disponibile.</p>
        </div>
        <button id="aiBtn" class="primary-action ai-action" type="button">Consiglio AI</button>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
